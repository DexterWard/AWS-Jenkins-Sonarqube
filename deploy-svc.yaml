apiVersion: apps/v1  
kind: Deployment  
metadata:  
  name: devsecops-demo  
  namespace: devsecops
  labels:  
    app: devsecops-demo  
spec:  
  replicas: 2  
  selector:  
    matchLabels:  
      app: devsecops-demo  
  template:  
    metadata:  
      labels:  
        app: devsecops-demo  
    spec:  
      topologySpreadConstraints:  
        - maxSkew: 1  
          topologyKey: topology.kubernetes.io/zone  
          whenUnsatisfiable: DoNotSchedule  
          labelSelector:  
            matchLabels:  
              app: devsecops-demo  
      containers:  
        - name: devsecops-demo  
          image: 764763463632.dkr.ecr.eu-central-1.amazonaws.com/devsecops-demo:latest 
          ports:  
            - containerPort: 8080
---
apiVersion: v1  
kind: Service  
metadata:  
  name: devsecops-demo-svc  
  namespace: devsecops
  labels:  
    app: devsecops-demo  
spec:  
  type: NodePort  
  selector:  
    app: devsecops-demo  
  ports:  
    - port: 80  
      targetPort: 8080  
      protocol: TCP  
      nodePort: 31000  